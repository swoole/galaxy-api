<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初始化 CodeGalaxy</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f4f7fb; color: #172033; display: grid; place-items: center; padding: 24px; }
    main { width: min(680px, 100%); background: #fff; border: 1px solid #dfe6f1; border-radius: 16px; padding: 32px; box-shadow: 0 16px 48px rgba(25, 45, 80, .1); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .lead { margin: 0 0 28px; color: #5b6780; }
    .database { padding: 16px; margin-bottom: 24px; border-radius: 10px; background: #f7f9fc; font-size: 14px; line-height: 1.7; }
    .ok { color: #087f5b; } .error { color: #c92a2a; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; height: 44px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 0 12px; font-size: 15px; }
    input:focus { border-color: #2463eb; outline: 3px solid rgba(36, 99, 235, .12); }
    button { width: 100%; height: 46px; margin-top: 24px; border: 0; border-radius: 8px; background: #2463eb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { min-height: 24px; margin: 16px 0 0; font-size: 14px; }
    .hint { color: #6b7280; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>初始化 CodeGalaxy</h1>
  <p class="lead">此页面只在首次安装时开放。完成后将永久关闭。</p>
  <section id="database" class="database">正在检查数据库连接……</section>
  <form id="install-form" hidden>
    <label for="install-token">安装令牌</label>
    <input id="install-token" name="install_token" type="password" autocomplete="off" required minlength="32">
    <div class="hint">令牌由安装命令生成，也保存在安装目录的 <code>.env</code> 中。</div>

    <label for="email">管理员邮箱</label>
    <input id="email" name="email" type="email" autocomplete="username" value="admin@example.com" required>

    <label for="nickname">管理员昵称</label>
    <input id="nickname" name="nickname" value="Administrator" required maxlength="255">

    <label for="password">管理员密码</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="20">

    <label for="password-retry">确认密码</label>
    <input id="password-retry" name="password_retry" type="password" autocomplete="new-password" required minlength="8" maxlength="20">

    <button id="submit" type="submit">完成初始化</button>
    <p id="message"></p>
  </form>
</main>
<script>
const database = document.querySelector('#database')
const form = document.querySelector('#install-form')
const message = document.querySelector('#message')
const submit = document.querySelector('#submit')
const tokenFromUrl = new URLSearchParams(location.hash.slice(1)).get('token')
if (tokenFromUrl) {
  document.querySelector('#install-token').value = tokenFromUrl
  history.replaceState(null, '', location.pathname)
}

async function loadStatus () {
  const response = await fetch('/api/install/status', { cache: 'no-store' })
  const result = await response.json()
  const data = result.data || {}
  if (data.installed) {
    location.replace('/')
    return
  }
  const db = data.database || {}
  if (data.default_email) document.querySelector('#email').value = data.default_email
  if (!db.connected) {
    database.className = 'database error'
    database.textContent = db.error || '数据库连接失败。'
    return
  }
  database.className = 'database ok'
  database.textContent = `数据库已连接：${db.username}@${db.host}:${db.port}/${db.name}`
  form.hidden = false
}

form.addEventListener('submit', async event => {
  event.preventDefault()
  submit.disabled = true
  message.className = ''
  message.textContent = '正在初始化，请勿关闭页面……'
  const payload = Object.fromEntries(new FormData(form).entries())
  try {
    const response = await fetch('/api/install/initialize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    const result = await response.json().catch(() => ({}))
    if (!response.ok || result.code) throw new Error(result.msg || `初始化失败（HTTP ${response.status}）`)
    message.className = 'ok'
    message.textContent = '初始化完成，正在进入登录页面……'
    setTimeout(() => location.replace('/'), 1200)
  } catch (error) {
    message.className = 'error'
    message.textContent = error.message
    submit.disabled = false
  }
})

loadStatus().catch(error => {
  database.className = 'database error'
  database.textContent = `无法读取安装状态：${error.message}`
})
</script>
</body>
</html>
